<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test - Tawasol CRM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        .success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }
        .info {
            background: #eef;
            color: #33c;
            border: 1px solid #ccf;
        }
        .log {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        .log-item {
            margin-bottom: 8px;
            padding: 4px;
            border-left: 3px solid #667eea;
            padding-left: 8px;
        }
        .log-error {
            border-left-color: #c33;
            color: #c33;
        }
        .log-success {
            border-left-color: #3c3;
            color: #3c3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Simple Login Test</h1>
        <p class="subtitle">Testing backend connectivity from your phone</p>
        
        <div id="message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="tenant">Organization/Tenant:</label>
                <input type="text" id="tenant" value="acme" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="rahmanamanur51@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            
            <button type="submit" id="submitBtn">Login</button>
        </form>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        const log = document.getElementById('log');
        const messageDiv = document.getElementById('message');
        
        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = `log-item ${type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : ''}`;
            logItem.textContent = `[${time}] ${message}`;
            log.insertBefore(logItem, log.firstChild);
        }
        
        function showMessage(message, type = 'info') {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';
        }
        
        // Detect backend URL
        const protocol = window.location.protocol;
        const hostname = window.location.hostname;
        const backendURL = `${protocol}//${hostname}:5000/api`;
        
        addLog(`Detected Backend URL: ${backendURL}`);
        addLog(`Current Page URL: ${window.location.href}`);
        addLog(`User Agent: ${navigator.userAgent}`);
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const tenant = document.getElementById('tenant').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
            messageDiv.style.display = 'none';
            
            addLog('🔵 Login attempt started');
            addLog(`Email: ${email}`);
            addLog(`Tenant: ${tenant}`);
            
            try {
                const loginURL = `${backendURL}/auth/login`;
                addLog(`Making request to: ${loginURL}`);
                
                const requestBody = {
                    email: email,
                    password: password,
                    isCustomer: false
                };
                
                addLog(`Request body: ${JSON.stringify(requestBody)}`);
                
                const response = await fetch(loginURL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Tenant-Subdomain': tenant
                    },
                    body: JSON.stringify(requestBody)
                });
                
                addLog(`✅ Response received! Status: ${response.status}`);
                
                const data = await response.json();
                addLog(`Response data: ${JSON.stringify(data).substring(0, 100)}...`);
                
                if (response.ok && data.success) {
                    addLog('✅ Login successful!', 'success');
                    showMessage('✅ Login successful! Backend connection working!', 'success');
                } else {
                    addLog(`❌ Login failed: ${data.message || 'Unknown error'}`, 'error');
                    showMessage(`❌ ${data.message || 'Login failed'}`, 'error');
                }
                
            } catch (error) {
                addLog(`❌ ERROR: ${error.message}`, 'error');
                addLog(`Error details: ${JSON.stringify(error)}`, 'error');
                showMessage(`❌ Connection error: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
        
        addLog('✅ Page loaded and ready');
    </script>
</body>
</html>
